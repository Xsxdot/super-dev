# CI verifies the portable checks that contributors can reproduce locally.
# Release packaging, code signing, and notarization stay in the documented
# release process until the repository has the required GitHub secrets.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent:
    name: Go agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Run Go tests
        working-directory: agent
        run: go test ./...

  desktop:
    name: Desktop web checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Verify version metadata
        run: node scripts/check-version.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build desktop web bundle
        working-directory: desktop
        run: pnpm build

      - name: Run desktop tests
        working-directory: desktop
        run: pnpm test

  desktop-linux:
    name: Desktop Linux package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build remote agents and sidecars
        run: BUILD_REMOTE_INSTALL=1 bash desktop/scripts/build-agent.sh

      - name: Build Tauri Linux packages
        working-directory: desktop
        run: pnpm tauri build
