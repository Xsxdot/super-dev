# CI verifies the portable checks that contributors can reproduce locally.
# Release packaging, code signing, and notarization stay in the documented
# release process until the repository has the required GitHub secrets.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent:
    name: Go agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Run Go tests
        working-directory: agent
        run: go test ./...

      - name: Run Unix manual uninstall contract tests
        run: bash scripts/uninstall-agent.test.sh

  agent-windows:
    name: Go agent (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build Go agent
        working-directory: agent
        run: go build ./...

      - name: Run Windows platform tests
        working-directory: agent
        run: |
          go test ./onboarding -run 'TestSeedSampleProjectWritesLoadableConfigForWindowsBinaryPath|TestSeedSampleProjectRepairsLegacyWindowsConfigMarkedSeeded' -count=1
          go test ./process -run TestJobObjectKillsChildTree -count=1
          go test ./codedebug -run TestNodeAttachWindowsUsesPrearm -count=1
          go test ./installer -run 'TestNormalizePlatformWindowsBinaryName|TestInstallerInstallsWindowsAgent' -count=1
          go test ./langruntime -run 'TestNodePrearmArgsForWindows|TestNodePrearmEnvForWindows|TestNodeDebuggerSpecForPlatform' -count=1
          go test ./windowsvalidation -run PowerShell -count=1

  runtime-validation-package-contracts:
    # This job proves source/CLI portability only. Native target summaries are
    # produced by dedicated machines and use runtime-validation-native-summary-*.
    name: Runtime validation package contracts (not native PASS)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Run runtime validation contract tests
        working-directory: agent
        run: go test ./runtimevalidation/... ./cmd/runtime-validation/... ./cmd/build-runtime-validation/...

      - name: Cross-compile package entrypoints without claiming target PASS
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/runtime-validation-package-contracts"
          mkdir -p "$output/bin"
          while read -r goos goarch extra; do
            if [[ -z "${goos:-}" || "$goos" == \#* ]]; then
              continue
            fi
            if [[ -z "${goarch:-}" || -n "${extra:-}" ]]; then
              echo "invalid target contract row: $goos ${goarch:-} ${extra:-}" >&2
              exit 1
            fi
            suffix=""
            if [[ "$goos" == "windows" ]]; then
              suffix=".exe"
            fi
            (
              cd agent
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -o "$output/bin/runtime-validation-$goos-$goarch$suffix" ./cmd/runtime-validation
            )
          done < validation/runtime/targets.txt
          cp validation/runtime/targets.txt "$output/targets.txt"
          printf '%s\n' 'Cross-compiled package contract only; this artifact is not package_verified and is not native target PASS.' > "$output/SCOPE.txt"

      - name: Upload package contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-package-contracts
          if-no-files-found: error
          path: ${{ runner.temp }}/runtime-validation-package-contracts

      - name: Run Windows manual uninstall contract tests
        shell: pwsh
        run: ./scripts/uninstall-agent.windows.test.ps1

  desktop:
    name: Desktop web checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Verify version metadata
        run: node scripts/check-version.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build desktop web bundle
        working-directory: desktop
        run: pnpm build

      - name: Run desktop tests
        working-directory: desktop
        run: pnpm test

  desktop-linux:
    name: Desktop Linux package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build remote agents and sidecars
        run: BUILD_REMOTE_INSTALL=1 bash desktop/scripts/build-agent.sh

      - name: Run Connector registry smoke on Linux
        working-directory: desktop/src-tauri
        run: cargo test mcp_install::connectors -- --nocapture

      - name: Upload remote agent binaries
        uses: actions/upload-artifact@v4
        with:
          name: superdev-agent-binaries
          if-no-files-found: error
          path: |
            scripts/install-agent.sh
            scripts/uninstall-agent.sh
            scripts/uninstall-agent.ps1
            desktop/src-tauri/resources/agent-install/superdev-agent-*

      - name: Build Tauri Linux packages
        working-directory: desktop
        run: pnpm tauri build

      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: superdev-desktop-linux
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm

  desktop-macos:
    name: Desktop macOS package
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build remote agents and sidecars
        run: BUILD_REMOTE_INSTALL=1 bash desktop/scripts/build-agent.sh

      - name: Run Connector registry smoke on macOS
        working-directory: desktop/src-tauri
        run: cargo test mcp_install::connectors -- --nocapture

      - name: Build Tauri macOS packages
        working-directory: desktop
        run: pnpm tauri build

      - name: Upload macOS desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: superdev-desktop-macos
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.app.tar.gz

  desktop-windows:
    name: Desktop Windows package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build remote agents and sidecars
        shell: bash
        run: BUILD_REMOTE_INSTALL=1 bash desktop/scripts/build-agent.sh

      - name: Verify Windows sidecar names
        shell: bash
        run: |
          target="$(rustc --print host-tuple)"
          for name in superdev-agent superdev-mcp superdev-sample; do
            test -f "desktop/src-tauri/binaries/$name-$target.exe"
            test -f "desktop/src-tauri/target/debug/$name.exe"
          done
          test -f desktop/src-tauri/resources/agent-install/superdev-agent-windows-amd64.exe

      - name: Run Connector registry smoke on Windows
        working-directory: desktop/src-tauri
        run: cargo test mcp_install::connectors -- --nocapture

      - name: Build Tauri Windows packages
        working-directory: desktop
        run: pnpm tauri build

      - name: Upload Windows desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: superdev-desktop-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
