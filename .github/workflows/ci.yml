# CI verifies the portable checks that contributors can reproduce locally.
# Release packaging, code signing, and notarization stay in the documented
# release process until the repository has the required GitHub secrets.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent:
    name: Go agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Run Go tests
        working-directory: agent
        run: go test ./...

  agent-windows:
    name: Go agent (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build Go agent
        working-directory: agent
        run: go build ./...

      - name: Run Windows platform tests
        working-directory: agent
        run: |
          go test ./process -run TestJobObjectKillsChildTree -count=1
          go test ./codedebug -run TestNodeAttachWindowsUsesPrearm -count=1
          go test ./installer -run 'TestNormalizePlatformWindowsBinaryName|TestInstallerInstallsWindowsAgent' -count=1
          go test ./langruntime -run 'TestNodePrearmArgsForWindows|TestNodePrearmEnvForWindows|TestNodeDebuggerSpecForPlatform' -count=1

  desktop:
    name: Desktop web checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Verify version metadata
        run: node scripts/check-version.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build desktop web bundle
        working-directory: desktop
        run: pnpm build

      - name: Run desktop tests
        working-directory: desktop
        run: pnpm test

  desktop-linux:
    name: Desktop Linux package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build remote agents and sidecars
        run: BUILD_REMOTE_INSTALL=1 bash desktop/scripts/build-agent.sh

      - name: Build Tauri Linux packages
        working-directory: desktop
        run: pnpm tauri build

  desktop-windows:
    name: Desktop Windows package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build remote agents and sidecars
        shell: bash
        run: BUILD_REMOTE_INSTALL=1 bash desktop/scripts/build-agent.sh

      - name: Verify Windows sidecar names
        shell: bash
        run: |
          target="$(rustc --print host-tuple)"
          for name in superdev-agent superdev-mcp superdev-sample; do
            test -f "desktop/src-tauri/binaries/$name-$target.exe"
            test -f "desktop/src-tauri/target/debug/$name.exe"
          done
          test -f desktop/src-tauri/resources/agent-install/superdev-agent-windows-amd64.exe

      - name: Build Tauri Windows packages
        working-directory: desktop
        run: pnpm tauri build
