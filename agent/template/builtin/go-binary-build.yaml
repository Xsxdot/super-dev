id: go-binary-build
name: Go Binary Build
description: Build a Go binary and optionally package explicit files into a tar.gz artifact.
version: 1.0.0
inputs:
  work_dir:
    label: Project directory
    type: path
    required: true
    default: ${workspace}
    description: Local directory where the Go build command runs, usually the project root or backend module directory.
  package:
    label: Go package
    type: string
    required: true
    default: ./...
    description: Go package pattern passed to go build, for example ./cmd/server or ./...
  output:
    label: Binary output
    type: path
    required: true
    default: ${output}/app
    description: Final local binary output path under the standard output root.
  build_env:
    label: Build environment
    type: string
    description: Optional environment assignments prepended to go build, for example GOOS=linux GOARCH=amd64 CGO_ENABLED=0.
  artifact:
    label: Artifact path
    type: path
    description: Optional final tar.gz artifact path. Leave empty to skip packaging and let a later package template create the artifact.
  files:
    label: Package files
    type: file_list
    description: Files to package when artifact is set. Include the built binary and any config or env files that should ship with it.
steps:
  - name: Build
    type: local_command
    with:
      workDir: ${vars.work_dir}
      cmd: mkdir -p "$(dirname "${vars.output}")" && ${vars.build_env:-} go build -o "${vars.output}" ${vars.package}
  - name: Package
    type: archive_package
    needs: [Build]
    run_if: '"${vars.artifact:-}" != ""'
    with:
      artifact: ${vars.artifact:-}
      files: ${vars.files}
      format: tar.gz
