id: nginx-static-deploy
name: Nginx 静态部署 / Nginx Static Deploy
description: 上传静态产物，切换当前目录，并重载 Nginx。/ Upload a static artifact, switch the current directory, and reload Nginx.
category: deploy
version: 1.0.0
inputs:
  role:
    label: 目标机器 / Target machines
    type: target_role
    required: true
    description: 接收静态产物并重载 Nginx 的机器。/ Nginx machines that receive the static artifact and reload Nginx.
  artifact:
    label: 产物路径 / Artifact path
    type: path
    required: true
    description: 由构建或打包模板生成并上传到目标机器的最终本地 tar.gz 产物路径。/ Final local tar.gz artifact path produced by a build or package template and uploaded to each target machine.
  release_dir:
    label: 发布目录 / Release directory
    type: path
    required: true
    description: 用于存放解压后静态发布内容和上传暂存文件的远端目录。/ Remote directory that stores extracted static release contents and upload staging files.
  current_dir:
    label: 当前软链接 / Current symlink
    type: path
    required: true
    description: 指向当前生效静态发布目录的远端软链接路径。/ Remote symlink path that points Nginx at the active static release.
  app_name:
    label: 应用名 / App name
    type: string
    required: true
    description: 用于远端发布目录和上传归档文件名的应用名称。/ Application name used for remote release folder and uploaded archive name.
steps:
  - name: Prepare
    type: remote_command
    roles: ["${vars.role}"]
    with:
      cmd: mkdir -p ${vars.release_dir}/${vars.app_name} ${vars.release_dir}/uploads
  - name: Upload
    type: transfer
    roles: ["${vars.role}"]
    needs: [Prepare]
    with:
      source: ${vars.artifact}
      target: ${vars.release_dir}/uploads/${vars.app_name}.tar.gz
  - name: Extract
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Upload]
    with:
      cmd: rm -rf ${vars.release_dir}/${vars.app_name}/* && tar -xzf ${vars.release_dir}/uploads/${vars.app_name}.tar.gz -C ${vars.release_dir}/${vars.app_name}
  - name: Switch
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Extract]
    with:
      cmd: ln -sfn ${vars.release_dir}/${vars.app_name} ${vars.current_dir}
  - name: Reload Nginx
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Switch]
    with:
      cmd: nginx -t && systemctl reload nginx
