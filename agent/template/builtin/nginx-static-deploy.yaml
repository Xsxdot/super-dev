id: nginx-static-deploy
name: Nginx Static Deploy
description: Upload a static artifact, switch the current directory, and reload Nginx.
version: 1.0.0
inputs:
  role:
    label: Target machines
    type: target_role
    required: true
    description: Nginx machines that receive the static artifact and reload Nginx.
  artifact:
    label: Artifact path
    type: path
    default: ${run_temp_dir}/artifacts/${app_name}.tar.gz
    description: Local tar.gz artifact path produced by the build template and uploaded to each target machine.
  release_dir:
    label: Release directory
    type: path
    required: true
    description: Remote directory that stores extracted static release contents and upload staging files.
  current_dir:
    label: Current symlink
    type: path
    required: true
    description: Remote symlink path that points Nginx at the active static release.
  app_name:
    label: App name
    type: string
    required: true
    description: Application name used for remote release folder and uploaded archive name.
steps:
  - name: Prepare
    type: remote_command
    roles: ["${vars.role}"]
    with:
      cmd: mkdir -p ${vars.release_dir}/${vars.app_name} ${vars.release_dir}/uploads
  - name: Upload
    type: transfer
    roles: ["${vars.role}"]
    needs: [Prepare]
    with:
      source: ${vars.artifact:-${vars.run_temp_dir}/artifacts/${vars.app_name}.tar.gz}
      target: ${vars.release_dir}/uploads/${vars.app_name}.tar.gz
  - name: Extract
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Upload]
    with:
      cmd: rm -rf ${vars.release_dir}/${vars.app_name}/* && tar -xzf ${vars.release_dir}/uploads/${vars.app_name}.tar.gz -C ${vars.release_dir}/${vars.app_name}
  - name: Switch
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Extract]
    with:
      cmd: ln -sfn ${vars.release_dir}/${vars.app_name} ${vars.current_dir}
  - name: Reload Nginx
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Switch]
    with:
      cmd: nginx -t && systemctl reload nginx
