id: node-standard-build
name: Node Standard Build
description: Install Node dependencies, run an optional build command, and package a Node service.
version: 1.0.0
inputs:
  work_dir:
    label: Project directory
    type: path
    required: true
    default: ${workspace}
    description: Local Node project directory where install and build commands run.
  install_cmd:
    label: Install command
    type: string
    required: true
    default: npm install
    description: Command that installs Node dependencies.
  build_cmd:
    label: Build command
    type: string
    required: true
    default: npm run build --if-present
    description: Command that prepares the service before packaging.
  artifact:
    label: Artifact path
    type: path
    required: true
    default: ${artifacts}/${app_name}.tar.gz
    description: Final tar.gz artifact path.
  files:
    label: Package files
    type: file_list
    required: true
    description: Files and directories to include in the Node service artifact.
steps:
  - name: Build
    type: local_command
    with:
      workDir: ${vars.work_dir}
      cmd: ${vars.install_cmd} && ${vars.build_cmd}
  - name: Package
    type: archive_package
    needs: [Build]
    with:
      artifact: ${vars.artifact}
      files: ${vars.files}
      format: tar.gz
