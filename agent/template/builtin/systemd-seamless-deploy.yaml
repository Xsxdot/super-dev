id: systemd-seamless-deploy
name: Systemd 无缝部署 / Systemd Seamless Deploy
description: 上传产物，写入 systemd unit，切换当前版本，重启服务，并验证 HTTP 健康状态。/ Upload an artifact, write a systemd unit, switch the current release, restart the service, and verify HTTP health.
category: deploy
version: 1.0.0
inputs:
  role:
    label: 目标机器 / Target machines
    type: target_role
    required: true
    description: 接收产物并执行 systemd 部署命令的机器。/ Machines that receive the artifact and run systemd deployment commands.
  artifact:
    label: 产物路径 / Artifact path
    type: path
    required: true
    description: 由构建或打包模板生成并上传到目标机器的最终本地 tar.gz 产物路径。/ Final local tar.gz artifact path produced by a build or package template and uploaded to each target machine.
  release_dir:
    label: 发布目录 / Release directory
    type: path
    required: true
    description: 用于存放发布内容和上传暂存文件的远端目录。/ Remote directory that stores release contents and upload staging files.
  current_dir:
    label: 当前软链接 / Current symlink
    type: path
    required: true
    description: 指向当前生效发布目录的远端软链接路径。/ Remote symlink path that points to the active release directory.
  app_name:
    label: 应用名 / App name
    type: string
    required: true
    description: 用于远端发布目录和上传归档文件名的应用名称。/ Application name used for remote release folder and uploaded archive name.
  service_name:
    label: Systemd 服务 / Systemd service
    type: string
    required: true
    description: 切换当前版本后需要写入、启用并重启的 systemd 服务名。/ systemd service name to write, enable, and restart after switching the current release.
  exec_start:
    label: ExecStart 命令 / ExecStart command
    type: string
    required: true
    description: 已部署服务的完整 systemd ExecStart 命令。/ Full systemd ExecStart command for the deployed service.
  working_dir:
    label: 工作目录 / Working directory
    type: path
    required: true
    description: 用作服务 systemd WorkingDirectory 的远端目录。/ Remote directory used as systemd WorkingDirectory for the service.
  port:
    label: 健康检查端口 / Health port
    type: number
    required: true
    default: "8080"
    description: 服务重启后 HTTP 健康检查使用的端口。/ HTTP port used for the post-restart health check.
  health_path:
    label: 健康检查路径 / Health path
    type: string
    required: true
    default: /health
    description: 服务重启后 HTTP 健康检查使用的路径。/ HTTP path used for the post-restart health check.
  user:
    label: 服务用户 / Service user
    type: string
    default: root
    description: systemd 运行服务时使用的 Linux 用户。/ Linux user that systemd should run the service as.
  environment:
    label: 环境变量行 / Environment lines
    type: string
    description: 可选的 systemd Environment= 行，会写入服务 unit。/ Optional systemd Environment= lines written into the service unit.
  restart:
    label: 重启策略 / Restart policy
    type: string
    default: always
    description: 已部署服务的 systemd Restart 策略。/ systemd Restart policy for the deployed service.
  skip_http_check:
    label: 跳过 HTTP 检查 / Skip HTTP check
    type: boolean
    default: "false"
    description: 不需要 HTTP 健康验证也允许服务重启时设为 true。/ Set to true when the service should restart without HTTP health verification.
steps:
  - name: Prepare
    type: remote_command
    roles: ["${vars.role}"]
    with:
      cmd: mkdir -p ${vars.release_dir}/${vars.app_name} ${vars.release_dir}/uploads
  - name: Upload
    type: transfer
    roles: ["${vars.role}"]
    needs: [Prepare]
    with:
      source: ${vars.artifact}
      target: ${vars.release_dir}/uploads/${vars.app_name}.tar.gz
  - name: Extract
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Upload]
    with:
      cmd: rm -rf ${vars.release_dir}/${vars.app_name} && mkdir -p ${vars.release_dir}/${vars.app_name} && tar -xzf ${vars.release_dir}/uploads/${vars.app_name}.tar.gz -C ${vars.release_dir}/${vars.app_name}
  - name: Switch
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Extract]
    with:
      cmd: ln -sfn ${vars.release_dir}/${vars.app_name} ${vars.current_dir}
  - name: Write Service
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Switch]
    with:
      cmd: |
        cat >/etc/systemd/system/${vars.service_name}.service <<'SUPERDEV_SERVICE'
        [Unit]
        Description=${vars.service_name}
        After=network.target

        [Service]
        Type=simple
        WorkingDirectory=${vars.working_dir}
        ExecStart=${vars.exec_start}
        Restart=${vars.restart:-always}
        RestartSec=2
        User=${vars.user:-root}
        ${vars.environment:-}

        [Install]
        WantedBy=multi-user.target
        SUPERDEV_SERVICE
  - name: Daemon Reload
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Write Service]
    with:
      cmd: systemctl daemon-reload && systemctl enable ${vars.service_name}.service
  - name: Restart
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Daemon Reload]
    with:
      cmd: systemctl reset-failed ${vars.service_name}.service || true; systemctl restart ${vars.service_name}.service
  - name: Health Check
    type: http_check
    roles: ["${vars.role}"]
    needs: [Restart]
    retries: 20
    retry_delay: 1s
    run_if: '"${vars.skip_http_check:-false}" != "true"'
    with:
      url: http://${host}:${vars.port}${vars.health_path}
      expected_status: 200
