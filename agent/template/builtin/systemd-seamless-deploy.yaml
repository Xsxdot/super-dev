id: systemd-seamless-deploy
name: Systemd Seamless Deploy
description: Upload an artifact, switch the current release, restart a systemd service, and verify HTTP health.
version: 1.0.0
inputs:
  role:
    label: Target machines
    type: target_role
    required: true
    description: Machines that receive the artifact and run systemd deployment commands.
  artifact:
    label: Artifact path
    type: path
    required: true
    description: Final local tar.gz artifact path produced by a build or package template and uploaded to each target machine.
  release_dir:
    label: Release directory
    type: path
    required: true
    description: Remote directory that stores release contents and upload staging files.
  current_dir:
    label: Current symlink
    type: path
    required: true
    description: Remote symlink path that points to the active release directory.
  app_name:
    label: App name
    type: string
    required: true
    description: Application name used for remote release folder and uploaded archive name.
  service_name:
    label: Systemd service
    type: string
    required: true
    description: systemd service name to restart after switching the current release.
  port:
    label: Health port
    type: number
    required: true
    default: "8080"
    description: HTTP port used for the post-restart health check.
  health_path:
    label: Health path
    type: string
    required: true
    default: /health
    description: HTTP path used for the post-restart health check.
steps:
  - name: Prepare
    type: remote_command
    roles: ["${vars.role}"]
    with:
      cmd: mkdir -p ${vars.release_dir}/${vars.app_name} ${vars.release_dir}/uploads
  - name: Upload
    type: transfer
    roles: ["${vars.role}"]
    needs: [Prepare]
    with:
      source: ${vars.artifact}
      target: ${vars.release_dir}/uploads/${vars.app_name}.tar.gz
  - name: Extract
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Upload]
    with:
      cmd: rm -rf ${vars.release_dir}/${vars.app_name}/* && tar -xzf ${vars.release_dir}/uploads/${vars.app_name}.tar.gz -C ${vars.release_dir}/${vars.app_name}
  - name: Switch
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Extract]
    with:
      cmd: ln -sfn ${vars.release_dir}/${vars.app_name} ${vars.current_dir}
  - name: Restart
    type: remote_command
    roles: ["${vars.role}"]
    needs: [Switch]
    with:
      cmd: systemctl restart ${vars.service_name}
  - name: Health Check
    type: http_check
    roles: ["${vars.role}"]
    needs: [Restart]
    with:
      url: http://${host}:${vars.port}${vars.health_path}
      expected_status: 200
