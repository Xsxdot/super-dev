id: vue-standard-build
name: Vue Standard Build
description: Install dependencies, build a Vue project, and optionally package explicit files into a tar.gz artifact.
version: 1.0.0
inputs:
  work_dir:
    label: Project directory
    type: path
    required: true
    default: ${workspace}
    description: Local Vue project directory where dependency install and build commands run.
  build_cmd:
    label: Build command
    type: string
    required: true
    default: pnpm install && pnpm build -- --outDir ${output}/dist
    description: Shell command that builds the Vue app. The default writes dist output under the standard output root.
  dist_dir:
    label: Dist directory
    type: path
    required: true
    default: ${output}/dist
    description: Built static files directory under the standard output root.
  artifact:
    label: Artifact path
    type: path
    description: Optional final tar.gz artifact path. Leave empty to skip packaging and let a later package template create the artifact.
  files:
    label: Package files
    type: file_list
    description: Files or directories to package when artifact is set, usually the dist directory plus any deployment config.
steps:
  - name: Build
    type: local_command
    with:
      workDir: ${vars.work_dir}
      cmd: ${vars.build_cmd}
  - name: Package
    type: archive_package
    needs: [Build]
    run_if: '"${vars.artifact:-}" != ""'
    with:
      artifact: ${vars.artifact:-}
      files: ${vars.files}
      format: tar.gz
