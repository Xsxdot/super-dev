id: rust-cargo-build
name: Rust Cargo 构建 / Rust Cargo Build
description: 构建 Rust release 二进制，并打包用于部署。/ Build a Rust release binary and package it for deployment.
category: build
version: 1.0.0
inputs:
  work_dir:
    label: 项目目录 / Project directory
    type: path
    required: true
    default: ${workspace}
    description: 本地 Cargo 项目目录。/ Local Cargo project directory.
  build_cmd:
    label: 构建命令 / Build command
    type: string
    required: true
    default: cargo build --release
    description: 生成 release 二进制的 Cargo 命令。/ Cargo command that creates the release binary.
  artifact:
    label: 产物路径 / Artifact path
    type: path
    required: true
    default: ${artifacts}/${app_name}.tar.gz
    description: 最终 tar.gz 产物路径。/ Final tar.gz artifact path.
  files:
    label: 打包文件 / Package files
    type: file_list
    required: true
    description: 需要写入产物的构建后二进制和配套文件。/ Built binary and supporting files to include in the artifact.
steps:
  - name: Build
    type: local_command
    with:
      workDir: ${vars.work_dir}
      cmd: ${vars.build_cmd}
  - name: Package
    type: archive_package
    needs: [Build]
    with:
      artifact: ${vars.artifact}
      files: ${vars.files}
      format: tar.gz
