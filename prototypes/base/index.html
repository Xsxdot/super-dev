<!DOCTYPE html>
<!--
  主界面原型 —— 镜像 desktop MainPage（路由 /）：
  侧边栏（项目头 + 环境组 + 服务行/节点叶子行）+ 工作台（日志面板）+ 底栏。
  数据全部为页面内 mock；交互只保留环境组折叠、节点叶子展开、日志过滤 chip 展示。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SuperDev · 主界面（原型）</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div class="main-layout">
  <div class="app-topbar">
    <div class="app-brand"><span class="app-brand-title">SuperDev</span></div>
    <div class="app-tabs-region">
      <div class="workspace-tabs">
        <span class="workspace-tab active">
          <span class="tab-kind">日志</span><span class="tab-title">tk · server</span><span class="tab-close">×</span>
        </span>
        <a class="workspace-tab" href="pages/node-center.html">
          <span class="tab-kind">节点</span><span class="tab-title">节点中心</span><span class="tab-close">×</span>
        </a>
      </div>
    </div>
  </div>

  <div class="main-content-row">
    <aside class="sidebar">
      <div class="sidebar-scroll">
        <div class="sidebar-search"><span>⌕</span><span>搜索服务 / 日志</span><span class="search-shortcut">⌘K</span></div>
        <a class="project-overview-strip" href="pages/project-overview.html">
          <span>▤</span><span class="overview-strip-main">项目概览</span><span class="overview-strip-hint">流水线 · 矩阵</span>
        </a>
        <div class="project-header">tk <span class="project-path">~/workspace/tk</span></div>

        <div class="env-group" data-env="dev">
          <div class="env-group-header" onclick="toggleEnv('dev')">
            <div class="env-title"><span class="expand-arrow">▾</span><span class="env-name">dev</span><span class="env-count">2</span></div>
            <div class="env-actions">
              <button class="action-btn">▶</button><button class="action-btn">⌕</button><button class="action-btn">⏹</button>
            </div>
          </div>
          <div class="env-group-rows" id="env-rows-dev">
            <div class="env-service-row selected">
              <span class="status-dot running"></span>
              <div class="service-main">
                <div class="service-name">server</div>
                <div class="service-meta">go · :9100 · 运行 2h13m</div>
              </div>
              <button class="node-toggle" onclick="toggleNodes(event, 'server')">▾</button>
              <div class="row-actions">
                <button class="action-btn">▶</button><button class="action-btn">↺</button><button class="action-btn">⏹</button>
              </div>
            </div>
            <div class="node-leaf-list" id="nodes-server">
              <div class="node-leaf-row">
                <span class="node-dot" style="background: var(--status-running)"></span>
                <span class="node-name">本机</span><span class="node-issue"></span>
              </div>
            </div>
            <div class="env-service-row">
              <span class="status-dot stopped"></span>
              <div class="service-main">
                <div class="service-name">admin</div>
                <div class="service-meta">vite · 未运行</div>
              </div>
              <div class="row-actions">
                <button class="action-btn">▶</button><button class="action-btn">↺</button><button class="action-btn">⏹</button>
              </div>
            </div>
          </div>
        </div>

        <div class="env-group" data-env="prod">
          <div class="env-group-header" onclick="toggleEnv('prod')">
            <div class="env-title"><span class="expand-arrow">▸</span><span class="env-name">prod</span><span class="env-count">1</span></div>
            <div class="env-actions">
              <button class="action-btn">▶</button><button class="action-btn">⌕</button><button class="action-btn">⏹</button>
            </div>
          </div>
          <div class="env-group-rows" id="env-rows-prod" hidden>
            <div class="env-service-row">
              <span class="status-dot running"></span>
              <div class="service-main">
                <div class="service-name">server</div>
                <div class="service-meta">systemd · aliyun-1 · 运行 6d</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-tools">
        <a class="sidebar-tool-button" href="pages/node-center.html">
          <span>▦</span><span class="sidebar-tool-main">节点中心</span><span class="sidebar-tool-hint">主机与远端</span>
        </a>
        <a class="sidebar-tool-button" href="pages/settings.html">
          <span>⚙</span><span class="sidebar-tool-main">设置</span><span class="sidebar-tool-hint">⌘,</span>
        </a>
      </div>
    </aside>

    <div class="workspace-column">
      <div class="panel-toolbar">
        <div class="segmented">
          <button class="active">包含</button><button>排除</button>
        </div>
        <input class="chip-input" placeholder="输入关键词过滤日志，回车成 chip">
        <span class="chip">ERROR ×</span>
      </div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <section class="bottom-group">
      <span class="group-label">已打开</span>
      <label class="service-chip"><span class="dot" style="background: var(--status-running)"></span><span class="svc-name">server</span></label>
    </section>
    <section class="bottom-group">
      <span class="group-label">选中操作</span>
      <button class="action-btn">↺ 重启</button>
      <button class="action-btn danger">⏹ 停止</button>
    </section>
    <section class="bottom-group">
      <span class="group-label">证据</span>
      <button class="action-btn">📌 3 条固定</button>
    </section>
  </div>
</div>

<script>
  // mock 日志数据：原型不连真实接口
  const logs = [
    { t: '14:02:11.031', lv: 'info',  msg: '[server] http server listening on :9100' },
    { t: '14:02:11.204', lv: 'info',  msg: '[server] mq consumer group tk-server joined' },
    { t: '14:02:14.887', lv: 'warn',  msg: '[server] config center latency 412ms, retry scheduled' },
    { t: '14:03:02.140', lv: 'info',  msg: '[server] GET /api/orders 200 12ms' },
    { t: '14:03:05.933', lv: 'error', msg: '[server] 处理章节 ch-1024 失败: context deadline exceeded' },
    { t: '14:03:06.001', lv: 'info',  msg: '[server] retrying chapter pipeline ch-1024 (attempt 2/3)' },
    { t: '14:03:08.412', lv: 'info',  msg: '[server] chapter pipeline ch-1024 done in 2.4s' },
  ];
  const list = document.getElementById('logList');
  logs.forEach(l => {
    const div = document.createElement('div');
    div.className = 'log-row';
    div.innerHTML = `<span class="log-time">${l.t}</span><span class="log-level-${l.lv}">${l.lv.toUpperCase()}</span><span class="log-msg">${l.msg}</span>`;
    list.appendChild(div);
  });

  // 环境组折叠 / 节点叶子展开
  function toggleEnv(env) {
    const rows = document.getElementById('env-rows-' + env);
    const arrow = document.querySelector(`[data-env="${env}"] .expand-arrow`);
    rows.hidden = !rows.hidden;
    arrow.textContent = rows.hidden ? '▸' : '▾';
  }
  function toggleNodes(e, svc) {
    e.stopPropagation();
    const leaf = document.getElementById('nodes-' + svc);
    leaf.hidden = !leaf.hidden;
    e.target.textContent = leaf.hidden ? '▸' : '▾';
  }
</script>
</body>
</html>
