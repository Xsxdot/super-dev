[package]
name = "superdev"
version = "0.2.3"
description = "SuperDev desktop application"
authors = ["SuperDev contributors"]
license = "Apache-2.0"
repository = "https://github.com/Xsxdot/super-dev"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
toml = "0.9.12"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2"
jsonc-parser = { version = "0.26.3", features = ["cst", "serde"] }
yaml-edit = { version = "0.2.1", default-features = false }
ureq = { version = "2", features = ["json"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }
